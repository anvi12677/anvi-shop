<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fbf4ec;--card:#ffffff;--text:#2b2220;--muted:#7a6a63;--accent:#c9593b;--line:#eadccf;--onaccent:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1d1715;--card:#2a211e;--text:#f6ece4;--muted:#b7a59b;--accent:#ee8465;--line:#3d302b;--onaccent:#1d1715;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#1d1715;--card:#2a211e;--text:#f6ece4;--muted:#b7a59b;--accent:#ee8465;--line:#3d302b;--onaccent:#1d1715;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:28px 16px 40px}
header{text-align:center;margin-bottom:18px}
.avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:32px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e58a5f,#c9593b)}
h1{margin:0;font-size:1.3rem}
.handle{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--text)}
.img{aspect-ratio:3/4;display:grid;place-items:center;font-size:44px;background:var(--line);overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.name{font-weight:600;font-size:.95rem}
.price{color:var(--muted);font-size:.9rem}
.buy{margin-top:8px;text-align:center;background:var(--accent);color:var(--onaccent);padding:8px;border-radius:10px;font-weight:600;font-size:.9rem}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.disclosure{margin:26px 0 0;text-align:center;font-size:.78rem;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
/* owner-only edit tools */
#admin:empty{display:none}
#admin{margin-bottom:16px;padding:12px;border:1px dashed var(--accent);border-radius:14px;background:var(--card)}
#admin .note{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
#admin button{font:inherit;cursor:pointer;border-radius:10px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);font-weight:600}
#admin button.ghost{background:transparent;color:var(--accent)}
#admin form{display:none;flex-direction:column;gap:8px;margin-top:10px}
#admin form.open{display:flex}
#admin input{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
#admin .row{display:flex;gap:8px}
#msg{font-size:.85rem;margin-top:8px;color:var(--accent)}
.rm{margin-top:6px;font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px;cursor:pointer}
</style>

<script>
const PRODUCTS = JSON.parse(document.getElementById("data").textContent);
let active = "All", editMode = false;
const chips = document.getElementById("chips"), grid = document.getElementById("grid"), admin = document.getElementById("admin");

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }
function collections(){ return ["All", ...new Set(PRODUCTS.map(p => p.collection))]; }

function render(){
  const cols = collections();
  if(!cols.includes(active)) active = "All";
  chips.textContent = "";
  cols.forEach(c => {
    const b = el("button","chip",c);
    b.setAttribute("aria-pressed", String(c === active));
    b.onclick = () => { active = c; render(); };
    chips.appendChild(b);
  });
  grid.textContent = "";
  const list = PRODUCTS.filter(p => active === "All" || p.collection === active);
  if(!list.length) grid.appendChild(el("div","empty","No products yet."));
  list.forEach(p => {
    const a = el("a","card");
    a.href = p.url || "#"; a.target = "_blank"; a.rel = "noopener sponsored";
    const img = el("div","img");
    if(p.img){ const i = document.createElement("img"); i.src = p.img; i.alt = p.name; i.loading = "lazy"; img.appendChild(i); } else img.textContent = "🛍️";
    const info = el("div","info");
    info.append(el("span","name",p.name)); if(p.price) info.append(el("span","price",p.price)); info.append(el("span","buy","Shop"));
    if(editMode){
      const r = el("button","rm","Remove");
      r.onclick = async ev => { ev.preventDefault(); ev.stopPropagation(); if(!confirm("Remove “"+p.name+"”?")) return; PRODUCTS.splice(PRODUCTS.indexOf(p),1); render(); await save(); };
      info.appendChild(r);
    }
    a.append(img, info);
    grid.appendChild(a);
  });
}

function say(t){ const m = document.getElementById("msg"); if(m) m.textContent = t || ""; }

async function save(){
  const art = window.claude ? await window.claude.use("artifact") : null;
  if(!art){ say("Saving isn’t available in this view."); return false; }
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector("#data").textContent = JSON.stringify(PRODUCTS).replace(/</g,"\\u003c");
  ["chips","grid","admin"].forEach(id => { clone.querySelector("#"+id).textContent = ""; });
  try { await art.publish("<!DOCTYPE html>\n" + clone.outerHTML); return true; }
  catch(e){ if(e && e.code === "conflict") return false; say("Couldn’t save ("+(e && e.code || "error")+"). Try again."); return false; }
}

function toDataUrl(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",.8));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function enableEdit(){
  editMode = true;
  admin.textContent = "";
  admin.appendChild(el("p","note","Edit mode: only you can see this. Visitors just see the shop."));
  const add = el("button",null,"+ Add product");
  const form = document.createElement("form");
  const dl = document.createElement("datalist"); dl.id = "cols";
  const f = {};
  const mk = (key, ph, type) => { const i = document.createElement("input"); i.placeholder = ph; i.type = type || "text"; i.required = key !== "photo"; f[key] = i; return i; };
  const col = mk("collection","Collection (e.g. Tops)"); col.setAttribute("list","cols");
  const photo = mk("photo","Photo","file"); photo.accept = "image/*";
  const sub = el("button",null,"Save product"); sub.type = "submit";
  form.append(col, mk("name","Product name"), mk("price","Price (e.g. ₹999)"), mk("url","Buy link (https://…)","url"), photo, sub, dl);
  add.onclick = () => {
    dl.textContent = "";
    collections().slice(1).forEach(c => { const o = document.createElement("option"); o.value = c; dl.appendChild(o); });
    form.classList.toggle("open");
  };
  form.onsubmit = async ev => {
    ev.preventDefault(); sub.disabled = true; say("Saving…");
    const p = {collection:f.collection.value.trim(), name:f.name.value.trim(), price:f.price.value.trim(), url:f.url.value.trim()};
    try {
      if(f.photo.files[0]){
        const dataUrl = await toDataUrl(f.photo.files[0], 700);
        const assets = await window.claude.use("assets");
        if(assets){ const blob = await (await fetch(dataUrl)).blob(); const up = await assets.upload(blob); p.img = up.url; }
        else p.img = dataUrl;
      }
    } catch(e){ say("Photo couldn’t be added; saving without it."); }
    PRODUCTS.push(p);
    active = p.collection;
    render();
    const ok = await save();
    sub.disabled = false;
    if(ok === false) say("Not saved yet. Please try again.");
  };
  admin.append(add, form, el("div")); 
  const m = el("div"); m.id = "msg"; admin.appendChild(m);
  render();
}

render();
(async () => {
  try {
    if(!window.claude) return;
    const u = await window.claude.use("user");
    if(u && await u.canEdit()) enableEdit();
  } catch(e){}
})();
</script>
</body>
